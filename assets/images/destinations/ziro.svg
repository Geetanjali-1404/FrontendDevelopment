<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="g_ziro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191a19"/>
      <stop offset="100%" stop-color="#1e5128"/>
    </linearGradient>
    <radialGradient id="sun_ziro" cx="75%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#D8E9A8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#191a19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vignette" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="rgba(10,15,25,0.92)"/>
      <stop offset="60%" stop-color="rgba(10,15,25,0.2)"/>
      <stop offset="100%" stop-color="rgba(10,15,25,0.4)"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="500" fill="url(#g_ziro)"/>
  <circle cx="600" cy="150" r="140" fill="url(#sun_ziro)"/>

  <!-- Heritage Architecture / Landscape Silhouettes -->
  <path d="M 0 360 Q 200 290 440 340 T 800 310 L 800 500 L 0 500 Z" fill="#191a19" opacity="0.4"/>
  <path d="M 0 400 Q 280 340 540 390 T 800 370 L 800 500 L 0 500 Z" fill="#1e5128" opacity="0.3"/>

  <!-- Architectural Motif (Temple/Arch/Gate) -->
  <g fill="#D8E9A8" opacity="0.25" transform="translate(500, 150) scale(0.75)">
    <polygon points="100,10 130,70 70,70"/>
    <rect x="80" y="70" width="40" height="120"/>
    <polygon points="170,30 190,80 150,80"/>
    <rect x="160" y="80" width="20" height="110"/>
    <polygon points="30,30 50,80 10,80"/>
    <rect x="20" y="80" width="20" height="110"/>
  </g>

  <!-- River / Pathway Horizon -->
  <path d="M 0 440 Q 350 420 800 460 L 800 500 L 0 500 Z" fill="#0A0E14" opacity="0.6"/>

  <!-- Vignette -->
  <rect width="800" height="500" fill="url(#vignette)"/>

  <!-- Emblems and Titles -->
  <g transform="translate(40, 50)">
    <rect width="110" height="32" rx="16" fill="#D8E9A8" fill-opacity="0.2" stroke="#D8E9A8" stroke-width="1.5"/>
    <text x="55" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#D8E9A8" text-anchor="middle" letter-spacing="1">HERITAGE</text>
  </g>

  <g transform="translate(40, 420)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="34" font-weight="bold" fill="#FFFFFF">Ziro Pine Valley</text>
    <text x="0" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#E2E8F0">Arunachal Pradesh, Northeast India</text>
  </g>
</svg>