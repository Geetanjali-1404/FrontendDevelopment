// --- File: CrowdMeter.jsx ---
const CrowdMeter = ({ level, percent = 15, statusText, advice, showAdvice = false }) => {
  const [showTooltip, setShowTooltip] = useState(false);

  // Determine color theme based on density
  let badgeColor = 'bg-emerald-50 text-emerald-800 border-emerald-200';
  let dotColor = 'bg-emerald-500';
  let pulseRing = 'ring-emerald-400';
  let status = statusText || 'Quiet & Peaceful';

  if (level === 'moderate' || (percent >= 30 && percent < 65)) {
    badgeColor = 'bg-amber-50 text-amber-800 border-amber-200';
    dotColor = 'bg-amber-500';
    pulseRing = 'ring-amber-400';
    status = statusText || 'Moderate (Dawn Best)';
  } else if (level === 'crowded' || percent >= 65) {
    badgeColor = 'bg-rose-50 text-rose-800 border-rose-200';
    dotColor = 'bg-rose-500';
    pulseRing = 'ring-rose-400';
    status = statusText || 'High Traffic';
  }

  return (
    <div className="relative inline-block">
      <div 
        onMouseEnter={() => setShowTooltip(true)}
        onMouseLeave={() => setShowTooltip(false)}
        onClick={() => setShowTooltip(!showTooltip)}
        className={`inline-flex items-center gap-2 px-2.5 py-1 rounded-full text-xs font-semibold border shadow-xs transition-all duration-200 cursor-pointer ${badgeColor}`}
      >
        <span className="relative flex h-2 w-2">
          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full opacity-75 ${dotColor}`}></span>
          <span className={`relative inline-flex rounded-full h-2 w-2 ${dotColor}`}></span>
        </span>
        <span className="font-medium tracking-tight">Crowd Meter:</span>
        <span className="font-bold">{status}</span>
        <span className="text-[10px] opacity-75 font-mono">({percent}%)</span>
        <Icon name="info" size={12} className="opacity-70" />
      </div>

      {/* Hover/Click Explainer Tooltip */}
      {showTooltip && (

  const currSymbol = currency === 'INR' ? '₹' : currency === 'USD' ? '$' : currency === 'EUR' ? '€' : '£';
  const formatPrice = (amt) => `${currSymbol}${Math.round(amt * rate).toLocaleString()}`;

  const handlePay = () => {
    setIsProcessing(true);
    setTimeout(() => {
      setIsProcessing(false);

          itemTitle: item.title || item.name,
          travelers,
          date,
          grandTotal: formatPrice(grandTotal),
          ticketRef: randomRef
        });
      }
    }, 1200);

// --- File: App.jsx ---
const App = () => {
  // Navigation
  const [currentPage, setCurrentPage] = useState('home');
  const [currency, setCurrency] = useState('INR'); // 'INR' | 'USD' | 'EUR' | 'GBP'
  
  // Auth state (null or { name, email, role })
  const [user, setUser] = useState(null);

  // Dynamic datasets
  const [destinations] = useState(destinationsData);
  const [packages] = useState(packagesData);
  const [guides] = useState(guidesData);
  const [reviews, setReviews] = useState(reviewsData);
  const [team] = useState(teamData);
  const [transportHubs] = useState(transportHubsData);
  const [faqs] = useState(faqsData);

  // Modals state
  const [activeGuide, setActiveGuide] = useState(null);
  const [activeRouteDest, setActiveRouteDest] = useState(null);
  const [activeBookingItem, setActiveBookingItem] = useState(null);
  const [authModalOpen, setAuthModalOpen] = useState(false);
  const [reviewModalOpen, setReviewModalOpen] = useState(false);

  // Notification Toast
  const [toast, setToast] = useState(null);

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 4000);
  };

  const handleBookingSuccess = (details) => {
    showToast(`✓ Booking Confirmed! Reference: ${details.ticketRef}`);
  };

  const handleReviewSubmit = (newRev) => {
    setReviews([newRev, ...reviews]);
    showToast('✓ Your verified heritage review has been published!');
  };

  const handleOpenBooking = (item, type = 'package') => {
    setActiveBookingItem({ item, type });
  };

  return (
    <div className="min-h-screen flex flex-col bg-[#FAF9F6] text-slate-800 font-sans selection:bg-[#D9534F] selection:text-white">
      
      {/* Toast Notification */}
      {toast && (
        <div className="fixed bottom-6 right-6 z-50 bg-slate-900 text-white px-5 py-3 rounded-2xl shadow-2xl border border-amber-400/40 text-xs font-bold flex items-center gap-2 animate-slide-up">
          <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
          <span>{toast}</span>
        </div>
      )}

      {/* Navigation Header */}
      <Navbar
        currentPage={currentPage}
        setCurrentPage={setCurrentPage}
        currency={currency}
        setCurrency={setCurrency}
        user={user}
        onOpenAuth={() => setAuthModalOpen(true)}
        onLogout={() => {
          setUser(null);
          showToast('Signed out successfully.');
        }}
      />

      {/* Main Page Routing */}
      <main className="flex-1">
        {currentPage === 'home' && (
          <HomePage
            destinations={destinations}
            packages={packages}
            guides={guides}
            reviews={reviews}
            currency={currency}
            setCurrentPage={setCurrentPage}
            onSelectDestination={(dest) => handleOpenBooking(dest, 'destination')}
            onSelectPackage={(pkg) => handleOpenBooking(pkg, 'package')}
            onSelectGuide={(g) => setActiveGuide(g)}
            onOpenRouteGuide={(dest) => setActiveRouteDest(dest)}
          />
        )}

        {currentPage === 'destinations' && (
          <DestinationsPage
            destinations={destinations}
            currency={currency}
            onSelectDestination={(dest) => handleOpenBooking(dest, 'destination')}
            onOpenRouteGuide={(dest) => setActiveRouteDest(dest)}
          />
        )}

        {currentPage === 'map' && (
          <CulturalMapPage
            destinations={destinations}
            transportHubs={transportHubs}
            currency={currency}
            onSelectDestination={(dest) => handleOpenBooking(dest, 'destination')}
            onOpenRouteGuide={(dest) => setActiveRouteDest(dest)}
          />
        )}

        {currentPage === 'packages' && (
          <PackagesPage
            packages={packages}
            currency={currency}
            onSelectPackage={(pkg) => handleOpenBooking(pkg, 'package')}
          />
        )}

        {currentPage === 'guide-onboarding' && (
          <GuideOnboardingPage />
        )}

        {currentPage === 'about' && (
          <AboutPage team={team} />
        )}

        {currentPage === 'reviews' && (
          <ReviewsPage
            reviews={reviews}
            onOpenReviewModal={() => setReviewModalOpen(true)}
          />
        )}

        {currentPage === 'contact' && (
          <ContactPage faqs={faqs} />
        )}
      </main>

      {/* Global Footer */}
      <Footer setCurrentPage={setCurrentPage} />

      {/* Interactive Modals */}
      {activeGuide && (
        <GuideModal
          guide={activeGuide}
          onClose={() => setActiveGuide(null)}
          onBookGuide={(g) => {
            setActiveGuide(null);
            handleOpenBooking({
              title: `Private Heritage Day with ${g.name}`,
              location: g.location,
              priceINR: g.hourlyRateINR * 5,
              image: g.videoIntro.thumbnail
            }, 'guide');
          }}
        />
      )}

      {activeRouteDest && (
        <RouteGuideModal
          destination={activeRouteDest}
          onClose={() => setActiveRouteDest(null)}
        />
      )}

      {activeBookingItem && (
        <BookingModal
          item={activeBookingItem.item}
          type={activeBookingItem.type}
          currency={currency}
          onClose={() => setActiveBookingItem(null)}
          onBookingSuccess={handleBookingSuccess}
        />
      )}

      {authModalOpen && (
        <AuthModal
          onClose={() => setAuthModalOpen(false)}
          onLoginSuccess={(userData) => {
            setUser(userData);
            showToast(`Welcome, ${userData.name}!`);
          }}
        />
      )}

      {reviewModalOpen && (
        <ReviewModal
          destinations={destinations}
          onClose={() => setReviewModalOpen(false)}
          onSubmitReview={handleReviewSubmit}
        />
      )}

    </div>
  );
};



// Render application to DOM
const rootElement = document.getElementById('root');
const root = ReactDOM.createRoot(rootElement);
root.render(<App />);

  </script>
</body>
</html>
